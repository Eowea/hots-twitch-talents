<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Pas de user-scalable=no : bloquer le zoom est un défaut d'accessibilité,
     et Apple le relève. Le double appui qui zoomerait par accident est écarté
     au cas par cas dans la feuille de style (touch-action). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talents — Heroes of the Storm</title>
<link rel="stylesheet" href="overlay.css?v=20">
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<!-- Le ?v= force le navigateur à relire ce fichier quand il change : sans
     lui, une adresse d'EBS modifiée reste en cache et l'extension appelle
     l'ancienne, sans autre symptôme qu'un « injoignable ». À incrémenter à
     chaque modification de reglages.js. -->
<script src="reglages.js?v=20"></script>
</head>

<!-- LA VUE MOBILE

     Twitch la sert dans son application iOS et Android, sous la vidéo, sur
     toute la largeur de l'écran. C'est la même page que le panneau — même
     mise en page fluide, même source de données ; seul l'appui remplace le
     survol. Le nom du fichier est imposé par la console : mobile.html.

     Twitch soumet les vues mobiles à la règle 4.7 d'Apple, celle des
     mini-applications intégrées à une application hôte. Ce que cette page
     respecte, point par point :

       — rien à acheter : ni bien numérique, ni abonnement, ni don, ni jeu
         d'argent, ni lien vers un moyen de paiement ;
       — aucune API native étendue ou exposée : la page ne fait qu'afficher
         le tableau publié par la chaîne, par le même service que le panneau ;
       — aucune saisie du spectateur : pas de champ, pas de message, donc
         aucun contenu tiers à modérer, signaler ou bloquer ;
       — aucune donnée du spectateur : ni compte, ni cookie, ni stockage
         local, ni mesure d'audience ;
       — tout public : des portraits de héros, des icônes de talents, et les
         pseudos du salon tels que le jeu les affiche déjà sur le direct.

     Le texte écrit ici est le français ; langue.js le remplace au chargement
     par celui du spectateur, avant le premier rendu. -->
<body data-mode="panneau" data-plateforme="mobile" data-titre="titreTableau">

<div id="tableau" class="tableau">
  <div class="cadre">
    <header class="entete">
      <span class="titre" data-t="talents">TALENTS</span>
    </header>

    <div class="corps">
      <section class="colonne" data-equipe="1">
        <!-- Le cartouche de niveau et les bans sont remplis par overlay.js. -->
        <div class="bandeau">
          <span class="marque"></span>
          <h2 data-t="equipeBleue">ÉQUIPE BLEUE</h2>
          <span class="niveau-equipe"></span>
          <span class="pousse"></span>
          <span class="bans-libelle" data-t="bannis" hidden>BANS</span>
          <span class="bans"></span>
        </div>
        <div class="paliers" aria-hidden="true"></div>
        <div class="lignes"></div>
      </section>
      <section class="colonne" data-equipe="2">
        <div class="bandeau">
          <span class="marque"></span>
          <h2 data-t="equipeRouge">ÉQUIPE ROUGE</h2>
          <span class="niveau-equipe"></span>
          <span class="pousse"></span>
          <span class="bans-libelle" data-t="bannis" hidden>BANS</span>
          <span class="bans"></span>
        </div>
        <div class="paliers" aria-hidden="true"></div>
        <div class="lignes"></div>
      </section>
    </div>

    <p id="attente" class="attente" data-t="attente">En attente d'une partie…</p>
  </div>
</div>

<script src="langue.js?v=20"></script>
<script src="overlay.js?v=20"></script>
</body>
</html>
