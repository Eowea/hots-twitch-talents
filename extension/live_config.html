<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talents — en direct</title>
<link rel="stylesheet" href="panneaux.css?v=2">
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<!-- Le ?v= force le navigateur à relire ce fichier quand il change : sans
     lui, une adresse d'EBS modifiée reste en cache et l'extension appelle
     l'ancienne, sans autre symptôme qu'un « injoignable ». À incrémenter à
     chaque modification de reglages.js. -->
<script src="reglages.js?v=2"></script>
</head>
<body>

<h1>TALENTS</h1>
<p class="sous-titre">État du lecteur pendant ton direct.</p>

<section>
  <h2>Lecteur</h2>
  <p class="pastille-etat" id="etat" data-actif="non">
    <span class="voyant" aria-hidden="true"></span>
    <span id="etat-texte">Vérification…</span>
  </p>
  <p class="detail" id="detail"></p>
</section>

<section>
  <h2>Si rien n'arrive</h2>
  <p class="detail">
    Lance <code>node pont.js</code> sur ton PC, avant ou pendant la partie.
    Le lecteur n'a besoin de rien d'autre : il lit un fichier que le jeu écrit
    lui-même, et se met à envoyer dès que la carte est chargée.
  </p>
</section>

<script src="live_config.js?v=2"></script>
</body>
</html>
