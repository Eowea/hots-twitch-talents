<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talents — en direct</title>
<link rel="stylesheet" href="panneaux.css?v=10">
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<!-- Le ?v= force le navigateur à relire ce fichier quand il change : sans
     lui, une adresse d'EBS modifiée reste en cache et l'extension appelle
     l'ancienne, sans autre symptôme qu'un « injoignable ». À incrémenter à
     chaque modification de reglages.js. -->
<script src="reglages.js?v=10"></script>
</head>

<body data-titre="titreDirect">

<h1 data-t="talents">TALENTS</h1>
<p class="sous-titre" data-t="directSousTitre">État du lecteur pendant ton direct.</p>

<section>
  <h2 data-t="directLecteur">Lecteur</h2>
  <p class="pastille-etat" id="etat" data-actif="non">
    <span class="voyant" aria-hidden="true"></span>
    <span id="etat-texte" data-t="directVerification">Vérification…</span>
  </p>
  <p class="detail" id="detail"></p>
</section>

<section>
  <h2 data-t="directSiRien">Si rien n'arrive</h2>
  <!-- La phrase est coupée autour du nom du programme : il ne se traduit pas,
       et les deux langues le placent au même endroit. -->
  <p class="detail">
    <span data-t="directSiRienDebut">Lance</span>
    <code>lecteur.exe</code>
    <span data-t="directSiRienFin">sur ton PC, avant ou pendant la partie.
    Le lecteur n'a besoin de rien d'autre : il lit un fichier que le jeu écrit
    lui-même, et se met à envoyer dès que la carte est chargée.</span>
  </p>
</section>

<script src="langue.js?v=10"></script>
<script src="live_config.js?v=10"></script>
</body>
</html>
