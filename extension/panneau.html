<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talents — Heroes of the Storm</title>
<link rel="stylesheet" href="overlay.css?v=22">
<script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
<!-- Le ?v= force le navigateur à relire ce fichier quand il change : sans
     lui, une adresse d'EBS modifiée reste en cache et l'extension appelle
     l'ancienne, sans autre symptôme qu'un « injoignable ». À incrémenter à
     chaque modification de reglages.js. -->
<script src="reglages.js?v=22"></script>
</head>

<!-- Un panneau est toujours visible : pas de bouton d'ouverture, pas de
     fermeture, et une mise en page resserrée pour tenir dans 318 px.

     Le texte écrit ici est le français ; langue.js le remplace au chargement
     par celui du spectateur, avant le premier rendu. -->
<body data-mode="panneau" data-titre="titreTableau">

<div id="tableau" class="tableau">
  <div class="cadre">
    <header class="entete">
      <span class="titre" data-t="talents">TALENTS</span>
    </header>

    <div class="corps">
      <section class="colonne" data-equipe="1">
        <!-- Le cartouche de niveau et les bans sont remplis par overlay.js. -->
        <div class="bandeau">
          <span class="marque"></span>
          <h2 data-t="equipeBleue">ÉQUIPE BLEUE</h2>
          <span class="niveau-equipe"></span>
          <span class="pousse"></span>
          <span class="bans-libelle" data-t="bannis" hidden>BANS</span>
          <span class="bans"></span>
        </div>
        <div class="paliers" aria-hidden="true"></div>
        <div class="lignes"></div>
      </section>
      <section class="colonne" data-equipe="2">
        <div class="bandeau">
          <span class="marque"></span>
          <h2 data-t="equipeRouge">ÉQUIPE ROUGE</h2>
          <span class="niveau-equipe"></span>
          <span class="pousse"></span>
          <span class="bans-libelle" data-t="bannis" hidden>BANS</span>
          <span class="bans"></span>
        </div>
        <div class="paliers" aria-hidden="true"></div>
        <div class="lignes"></div>
      </section>
    </div>

    <p id="attente" class="attente" data-t="attente">En attente d'une partie…</p>
  </div>
</div>

<script src="langue.js?v=22"></script>
<script src="overlay.js?v=22"></script>
</body>
</html>
